#time {
  font-family: 'TAYLennon', sans-serif;
  font-size: 72px;
  font-weight: normal;
  letter-spacing: -2px;
  line-height: 1;
}
#date {
  font-family: 'TAYLennon', sans-serif;
  font-size: 22px;
  color: #cccccc;
  font-weight: normal;
}
.divider {
  width: 100%;
  max-width: 640px;
  border: none;
  border-top: 1px solid #222;
  margin: 0.25rem 0;
}
.section-label {
  font-size: 12px;
  font-weight: 600;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.4rem;
  width: 100%;
  max-width: 640px;
}
#current-weather {
  display: flex;
  align-items: center;
  width: 100%;
  max-width: 640px;
  gap: 1rem;
}
#cur-temp { font-size: 32px; font-weight: 700; }
#cur-cond { font-size: 18px; font-weight: 600; color: #aaa; }
#aqi-badge {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}
#aqi-label { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 1px; }
#aqi-value { font-size: 32px; font-weight: 700; }
#aqi-cat { font-size: 12px; font-weight: 600; }
#forecast { display: flex; gap: 1rem; }
.forecast-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: #1a1a1a;
  border-radius: 10px;
  padding: 0.6rem 1rem;
  min-width: 80px;
}
.forecast-item .hour { font-size: 12px; font-weight: 600; color: #777; }
.forecast-item .icon { font-size: 20px; }
.forecast-item .temp { font-size: 20px; font-weight: 700; }
.forecast-item .desc { font-size: 11px; color: #555; font-weight: 500; text-align: center; }
#alerts {
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.alert-box { border-radius: 8px; padding: 0.75rem 1rem; font-size: 13px; font-weight: 600; line-height: 1.5; }
.alert-fire { background: #3a0a00; border-left: 4px solid rgb(255,80,40); color: rgb(255,140,80); }
.alert-weather { background: #2a1500; border-left: 4px solid rgb(255,140,80); color: rgb(255,140,80); }
.alert-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.alert-expires { font-size: 11px; opacity: 0.7; margin-top: 2px; font-weight: 500; }
#no-alerts { font-size: 13px; color: #333; font-weight: 500; }
#fact-section {
  width: 100%;
  max-width: 640px;
}
#fact-text {
  font-size: 14px;
  color: #555;
  font-weight: 400;
  line-height: 1.6;
  font-style: italic;
}
#fact-year {
  font-size: 12px;
  color: #444;
  font-weight: 600;
  margin-bottom: 4px;
}
#news-section {
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
}
.news-item a {
  font-size: 13px;
  color: #555;
  font-weight: 400;
  text-decoration: none;
  line-height: 1.5;
}
.news-item a:hover {
  color: #888;
}
</style>
</head>
<body>
<div id="time"></div>
<div id="date"></div>
<div id="fact-section">
  <div id="fact-year"></div>
  <div id="fact-text">Loading...</div>
</div>
<div id="news-section"></div>
<hr class="divider">
<div class="section-label">Downtown LA &middot; Now</div>
<div id="current-weather">
  <div>
    <div id="cur-temp">--&deg;F</div>
    <div id="cur-cond"></div>
  </div>
  <div id="aqi-badge">
    <div id="aqi-label">AQI</div>
    <div id="aqi-value">--</div>
    <div id="aqi-cat"></div>
  </div>
</div>
<div id="forecast"></div>
<hr class="divider">
<div class="section-label">NOAA Alerts &middot; Los Angeles County</div>
<div id="alerts"><div id="no-alerts">Checking alerts...</div></div>
<script>
function update() {
  var now = new Date();
  document.getElementById("time").textContent = now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  document.getElementById("date").textContent = now.toLocaleDateString([], {weekday:"long", year:"numeric", month:"long", day:"numeric"});
}
update();
setInterval(update, 10000);

function wmoToDesc(code) {
  if (code === 0) return ["sunny", "Clear"];
  if (code === 1) return ["mostly clear", "Mostly clear"];
  if (code === 2) return ["partly cloudy", "Partly cloudy"];
  if (code === 3) return ["overcast", "Overcast"];
  if (code === 45 || code === 48) return ["foggy", "Foggy"];
  if (code === 51 || code === 53 || code === 55) return ["drizzle", "Drizzle"];
  if (code === 61 || code === 63 || code === 65) return ["rain", "Rain"];
  if (code === 71 || code === 73 || code === 75) return ["snow", "Snow"];
  if (code === 80 || code === 81 || code === 82) return ["showers", "Showers"];
  if (code === 95 || code === 96 || code === 99) return ["storm", "Thunderstorm"];
  return ["unknown", "Unknown"];
}

function aqiMeta(aqi) {
  if (aqi <= 50)  return ["rgb(255,140,80)", "Good"];
  if (aqi <= 100) return ["rgb(255,140,80)", "Moderate"];
  if (aqi <= 150) return ["rgb(255,140,80)", "Sensitive groups"];
  if (aqi <= 200) return ["rgb(255,140,80)", "Unhealthy"];
  if (aqi <= 300) return ["rgb(255,140,80)", "Very unhealthy"];
  return ["rgb(255,140,80)", "Hazardous"];
}

async function fetchWeather() {
  try {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=34.0522&longitude=-118.2437&hourly=temperature_2m,weathercode&temperature_unit=celsius&timezone=America%2FLos_Angeles&forecast_days=2";
    var data = await (await fetch(url)).json();
    var times = data.hourly.time, temps = data.hourly.temperature_2m, codes = data.hourly.weathercode;
    var now = new Date();
    var todayStr = now.toISOString().slice(0,10);
    var si = times.findIndex(function(t) { return t === todayStr + "T" + String(now.getHours()).padStart(2,"0") + ":00"; });
    if (si === -1) si = 0;
    var cd = wmoToDesc(codes[si]);
    document.getElementById("cur-temp").textContent = Math.round(temps[si]) + "\u00b0C";
    document.getElementById("cur-cond").textContent = cd[1];
    var fe = document.getElementById("forecast");
    fe.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      var idx = si + i;
      if (idx >= times.length) break;
      var t = new Date(times[idx]);
      var desc = wmoToDesc(codes[idx]);
      var div = document.createElement("div");
      div.className = "forecast-item";
      div.innerHTML = "<span class=\"hour\">" + t.toLocaleTimeString([],{hour:"numeric",hour12:true}) + "</span><span class=\"icon\">" + desc[0] + "</span><span class=\"temp\">" + Math.round(temps[idx]) + "\u00b0</span><span class=\"desc\">" + desc[1] + "</span>";
      fe.appendChild(div);
    }
  } catch(e) { document.getElementById("cur-temp").textContent = "Unavailable"; }
}

async function fetchAQI() {
  try {
    var url = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=34.0522&longitude=-118.2437&hourly=us_aqi&timezone=America%2FLos_Angeles&forecast_days=1";
    var data = await (await fetch(url)).json();
    var now = new Date();
    var todayStr = now.toISOString().slice(0,10);
    var idx = data.hourly.time.findIndex(function(t) { return t === todayStr + "T" + String(now.getHours()).padStart(2,"0") + ":00"; });
    var aqi = data.hourly.us_aqi[idx !== -1 ? idx : 0];
    if (aqi !== null && aqi !== undefined) {
      var meta = aqiMeta(aqi);
      document.getElementById("aqi-value").textContent = Math.round(aqi);
      document.getElementById("aqi-value").style.color = meta[0];
      document.getElementById("aqi-cat").textContent = meta[1];
      document.getElementById("aqi-cat").style.color = meta[0];
    }
  } catch(e) { document.getElementById("aqi-value").textContent = "--"; }
}

async function fetchAlerts() {
  var alertsEl = document.getElementById("alerts");
  try {
    var data = await (await fetch("https://api.weather.gov/alerts/active?zone=CAZ041,CAZ040,CAC037")).json();
    var features = (data.features || []).filter(function(f) {
      return !/amber alert|child abduction/i.test(f.properties.event || "");
    });
    if (!features.length) { alertsEl.innerHTML = "<div id=\"no-alerts\">No active alerts</div>"; return; }
    alertsEl.innerHTML = "";
    features.slice(0,5).forEach(function(f) {
      var p = f.properties;
      var event = p.event || "Alert";
      var expires = p.expires ? new Date(p.expires).toLocaleString([],{weekday:"short",hour:"2-digit",minute:"2-digit"}) : "";
      var isFire = /fire|red flag/i.test(event);
      var div = document.createElement("div");
      div.className = "alert-box " + (isFire ? "alert-fire" : "alert-weather");
      div.innerHTML = "<div class=\"alert-title\">" + (isFire ? "FIRE: " : "ALERT: ") + event + "</div><div>" + (p.headline || event) + "</div>" + (expires ? "<div class=\"alert-expires\">Expires " + expires + "</div>" : "");
      alertsEl.appendChild(div);
    });
  } catch(e) { alertsEl.innerHTML = "<div id=\"no-alerts\">Alerts unavailable</div>"; }
}

async function fetchFact() {
  try {
    var now = new Date();
    var month = String(now.getMonth() + 1).padStart(2, "0");
    var day = String(now.getDate()).padStart(2, "0");
    var url = "https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/events/" + month + "/" + day;
    var data = await (await fetch(url, {"headers": {"Api-User-Agent": "DateTime Dashboard (grantbeaumont.github.io)"}})).json();
    var events = data.events;
    if (events && events.length) {
      var hour = now.getHours();
      var idx = hour % events.length;
      var event = events[idx];
      document.getElementById("fact-year").textContent = event.year;
      document.getElementById("fact-text").textContent = event.text;
    }
  } catch(e) {
    document.getElementById("fact-text").textContent = "";
  }
}

async function fetchNews() {
  try {
    var data = await (await fetch("news.json?nocache=" + Date.now())).json();
    var ns = document.getElementById("news-section");
    ns.innerHTML = "";
    data.forEach(function(item) {
      var div = document.createElement("div");
      div.className = "news-item";
      div.innerHTML = "<a href=\"" + item.link + "\" target=\"_blank\">" + item.title + "</a>";
      ns.appendChild(div);
    });
  } catch(e) {}
}

fetchWeather(); fetchAQI(); fetchAlerts(); fetchFact(); fetchNews();
setInterval(fetchWeather, 600000);
setInterval(fetchAQI, 600000);
setInterval(fetchAlerts, 600000);
setInterval(fetchFact, 3600000);
setInterval(fetchNews, 1800000);
</script>
</body>
</html>
